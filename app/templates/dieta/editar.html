{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h2 class="h4">
                <i class="fas fa-edit me-2"></i>
                Editar Dieta: {{ dieta.nombre }}
            </h2>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre de la Dieta</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" 
                                   value="{{ dieta.nombre }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ dieta.descripcion }}</textarea>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="fecha_inicio" class="form-label">Fecha de Inicio</label>
                                <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio" 
                                       value="{{ dieta.fecha_inicio.strftime('%Y-%m-%d') }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="fecha_fin" class="form-label">Fecha de Fin</label>
                                <input type="date" class="form-control" id="fecha_fin" name="fecha_fin" 
                                       value="{{ dieta.fecha_fin.strftime('%Y-%m-%d') }}" required>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="calorias_diarias" class="form-label">Calorías Diarias (kcal)</label>
                                <input type="number" class="form-control" id="calorias_diarias" name="calorias_diarias"
                                       value="{{ dieta.calorias_diarias }}">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="proteinas" class="form-label">Proteínas (g)</label>
                                <input type="number" step="0.1" class="form-control" id="proteinas" name="proteinas"
                                       value="{{ dieta.proteinas }}">
                            </div>
                            <div class="col-md-4">
                                <label for="carbohidratos" class="form-label">Carbohidratos (g)</label>
                                <input type="number" step="0.1" class="form-control" id="carbohidratos" name="carbohidratos"
                                       value="{{ dieta.carbohidratos }}">
                            </div>
                            <div class="col-md-4">
                                <label for="grasas" class="form-label">Grasas (g)</label>
                                <input type="number" step="0.1" class="form-control" id="grasas" name="grasas"
                                       value="{{ dieta.grasas }}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="notas" class="form-label">Notas Adicionales</label>
                            <textarea class="form-control" id="notas" name="notas" rows="3">{{ dieta.notas }}</textarea>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2">
                            {% if dieta.rutina %}
                            <a href="{{ url_for('rutina.lista_rutinas', cliente_id=dieta.cliente_id) }}" 
                               class="btn btn-secondary">
                                <i class="fas fa-times me-1"></i> Cancelar
                            </a>
                            {% else %}
                            <a href="{{ url_for('dieta.lista_dietas', cliente_id=dieta.cliente_id) }}" 
                               class="btn btn-secondary">
                                <i class="fas fa-times me-1"></i> Cancelar
                            </a>
                            {% endif %}
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Establecer fecha mínima como hoy para nuevas dietas
    const today = new Date().toISOString().split('T')[0];
    
    // Validar que fecha fin sea después de fecha inicio
    document.getElementById('fecha_inicio').addEventListener('change', function(e) {
        document.getElementById('fecha_fin').min = e.target.value;
    });
});
</script>
{% endblock %}
