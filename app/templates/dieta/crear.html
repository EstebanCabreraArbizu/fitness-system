{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h2 class="h4">
                <i class="fas fa-plus me-2"></i>
                Nueva Dieta para {{ cliente.nombres }} {{ cliente.apellidos }}
                {% if rutina %}
                <small class="text-muted">(Rutina: {{ rutina.titulo }})</small>
                {% endif %}
            </h2>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título de la Dieta</label>
                            <input type="text" class="form-control" id="titulo" name="titulo" 
                                   value="{% if rutina %}Dieta para {{ rutina.titulo }}{% endif %}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{% if rutina %}Dieta personalizada para la rutina {{ rutina.titulo }}{% endif %}</textarea>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="fecha_inicio" class="form-label">Fecha de Inicio</label>
                                <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio" 
                                       value="{% if rutina %}{{ rutina.fecha_inicio.strftime('%Y-%m-%d') }}{% endif %}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="fecha_fin" class="form-label">Fecha de Fin</label>
                                <input type="date" class="form-control" id="fecha_fin" name="fecha_fin" 
                                       value="{% if rutina %}{{ rutina.fecha_fin.strftime('%Y-%m-%d') }}{% endif %}" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="calorias_diarias" class="form-label">Calorías Diarias (kcal)</label>
                            <input type="number" class="form-control" id="calorias_diarias" name="calorias_diarias">
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2">
                            {% if rutina %}
                            <a href="{{ url_for('rutina.lista_rutinas', cliente_id=cliente.id) }}" 
                               class="btn btn-secondary">
                                <i class="fas fa-times me-1"></i> Cancelar
                            </a>
                            {% else %}
                            <a href="{{ url_for('dieta.lista_dietas', cliente_id=cliente.id) }}" 
                               class="btn btn-secondary">
                                <i class="fas fa-times me-1"></i> Cancelar
                            </a>
                            {% endif %}
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Crear y Agregar Comidas
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Establecer fecha mínima como hoy
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('fecha_inicio').min = today;
    document.getElementById('fecha_fin').min = today;
    
    // Validar que fecha fin sea después de fecha inicio
    document.getElementById('fecha_inicio').addEventListener('change', function(e) {
        document.getElementById('fecha_fin').min = e.target.value;
    });
});
</script>
{% endblock %}
